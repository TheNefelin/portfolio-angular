<footer class="footer bg-gray-900 text-neutral-content p-10 grid grid-cols-2 md:grid-cols-4">
  @for (urlGrp of urlGrpDetailList(); track urlGrp.id_urlgrp) {
    <nav>
      <h6 class="footer-title">{{ urlGrp.name }}</h6>
      @for (url of urlGrp.Urls; track url.id_url) {
        <a class="link link-hover" target="_blank" [href]="url.link">{{ url.name }}</a>
      }
    </nav>
  }
</footer>
