
<section class="flex justify-center px-2 pt-4">
  <div class="mx-auto w-full max-w-3xl overflow-hidden rounded bg-black shadow-lg">

    <!-- Header de la terminal -->
    <div class="flex items-center justify-between bg-gray-800 px-4 py-2">
      <div class="flex space-x-2">
        <div class="h-3 w-3 rounded-full bg-red-500"></div>
        <div class="h-3 w-3 rounded-full bg-yellow-500"></div>
        <div class="h-3 w-3 rounded-full bg-green-500"></div>
      </div>

      <div class="font-mono text-sm text-gray-300">
        MS-DOS Prompt
      </div>

      <div class="w-6"></div>
    </div>

    <!-- Cuerpo de la terminal -->
    <div
      class="h-72 overflow-y-auto bg-black p-4 font-mono text-green-400"
    >
      <div class="whitespace-pre-wrap">{{ displayedText() }}</div>
    </div>

    <!-- Línea de entrada -->
    <div
      class="flex items-center border-t border-gray-700 bg-black px-4 py-2 font-mono text-green-400"
    >
      <span class="mr-2">C:\&gt;</span>
      <span class="inline-block h-4 w-2 animate-pulse bg-green-400"></span>
    </div>

  </div>
</section>
