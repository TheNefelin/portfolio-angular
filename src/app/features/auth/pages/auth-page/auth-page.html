<section class="grid gap-2 justify-center items-center p-4">

  <app-auth-google-component
    [loading]="isBusy('google')"
    [disabled]="disabled()"
    (login)="loginGoogle()"/>

  <app-auth-github-component
    [loading]="isBusy('github')"
    [disabled]="disabled()"
    (login)="loginGitHub()"/>

  <app-auth-apple-component
    [loading]="isBusy('apple')"
    [disabled]="disabled()"
    (login)="loginApple()"/>

  <app-auth-login-component
    [loading]="isBusy('credentials')"
    [disabled]="disabled()"
    (login)="loginAuth()"/>

</section>
